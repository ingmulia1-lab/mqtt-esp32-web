<!DOCTYPE html>
<html>
<head>

<title>Acceso Torniquete</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body>

<h2>Escanear QR</h2>

<div id="reader"></div>

<script>

const client = mqtt.connect(
"wss://3759e23402c4448584ca5389cdd951e9.s1.eu.hivemq.cloud:8884/mqtt",
{
username:"IvanMulia",
password:"Musiol1980"
})

function abrirTorniquete(){

client.publish("torniquete/control","OPEN")

}

function onScanSuccess(){

let matricula = prompt("Ingrese matrícula")

fetch("http://localhost:3000/validar",{

method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({matricula})

})
.then(res=>res.json())
.then(data=>{

if(data.autorizado){

alert("Bienvenido "+data.nombre)

abrirTorniquete()

}else{

alert("Usuario no registrado")

}

})

}

const scanner = new Html5QrcodeScanner("reader",{fps:10,qrbox:250})

scanner.render(onScanSuccess)

</script>

</body>
</html>
